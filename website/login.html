<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance App Login (PWA)</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#e90eb2">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Attendance App Login</h1>
    </header>
    <main>
        <section class="card">
            <h2>Login</h2>
            <form action="/website/main" method="post"> # AI help
                <label>
                    Email
                    <input id="email" required placeholder="Enter your email">
                </label>
                <label>
                    Password
                    <input id="password" type="password" required placeholder="Enter your password">
                </label>
                <button type="submit">Login</button>
            </form>
        </section>
    </main>
