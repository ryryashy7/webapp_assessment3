<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Planner (PWA)</title>
    <link rel="manifest" href="mainfest.webmanifest">
    <meta name="theme-color" content="#e90eb2">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="192x192" href="/study_planner_pwa/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/study_planner_pwa/icons/icon-512.png">
</head>
<body>
    <header>
        <h1>Attendance</h1>
        <button id="Installbtn" hidden>Install App</button>
    </header>
  <section class="card dashboard">
    <h2>Attendance Dashboard</h2>
    <div class="stats">
        <div class="stat"><div class="num" id="statSubjects">0</div><div class="label">Days Absent Total</div></div>
        <div class="stat"><div class='num' id="statTasks">0</div><div class="label">Unexplained Absences</div></div>
        <div class="stat"><div class="num" id="statDueSoon">0</div><div class="label">Explained Absences</div></div>
        <div class="stat"><div class="num" id="statDonePct">0%</div>
        <div class="label">Attendance Percentage</div></div> 
    </div>
  </section>
  
  <main>
    <section class="card">
        <h2>Add Absence</h2>
        <form id="taskForm">
            <div class="grid2">
            <label>
                Name
                    <input id="UserAbesence" required placeholder="e.g. John Doe">
            </label>
                <label>
                    Type of Abesence
                    <select id="taskType" required>
                        <option>Unexplained</option>
                        <option>Medical Reasons</option>
                        <option>School Business (Excursion / Incursion)</option>
                    </select>
                </label>
            </div>
            <div class="grid2">
                <label>
                    Absence Date
                    <input id="absentDate" type="date" required>
                </label>
                <label>
                    Proof of Absence
                    <select id="proof">
                        <option value="false" selected>No</option>
                        <option value="true" selected>Yes</option>
                    </select>
                </label>
                <label>
                    Year Level
                    <select id="proof">
                        <option>Year 12</option>
                        <option>Year 11</option>
                        <option>Year 10</option>
                        <option>Year 9</option>
                        <option>Year 8</option>
                        <option>Year 7</option>
                    </select>
                </label>
            </div>
            <button type="submit">Add Task</button>
        </form>
        <div class="grid2">
            <label>
                Filter by Date
                <select id="filterSubject"><option value="">All</option></select>
            </label>
        </div>
        <ul id="taskList"></ul>
    </section>
  </main>
  <footer>Offline-ready • Data saved on this device</footer>
  <script src="app.js" defer></script>
  <script>
    if('serviceWorker' in navigator){
        window.addEventListener('load',()=> navigator.serviceWorker.register('service-worker.js'));
    }
  </script>
</body>
</html>
